<div class="container mt10">
    <div class="row">
        <div class="col-lg-12">
			<h2>Matches Played</h2>
            <div class="row py10">

                <!-- text box for day -->
                <div class="col-lg-2">
                    <input placeholder="Day" type="number" min="1" max="31" class="form-control" name="day" [(ngModel)]="day">
                </div>

                <!-- text box for month -->
                <div class="col-lg-2">
                    <input placeholder="Month" type="number" min="1" max="12" class="form-control" name="month" [(ngModel)]="month">
                </div>

                <!-- text box for year -->
                <div class="col-lg-2">
                    <input placeholder="Year" type="number" min="1999" max="2030" class="form-control" name="year" [(ngModel)]="year">
                </div>
                
                <div class="col-lg-2">
                    <div class="">
                        <button class="GreenButton" (click)="searchByDate()">Search</button>
                    </div>
                </div>
				 <div class="col-lg-2">
                    <div class="">
						<button class="RedButton" (click)="clear()">Clear Date</button>
                    </div>
                </div>
            </div>
     
            <div class="table-responsive">
                <table class="table table-striped">
                    <!-- table headings -->
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Home Club</th>
                            <th>Home Score</th>
                            <th>Away Score</th>
                            <th>Away Club</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- table data -->
                        <tr *ngFor="let match of matches">
                            <td> {{ match.datePlayed}} </td>
                            <td> {{ match.homeTeam }} </td>
                            <td> {{ match.homeScore }} </td>
                            <td> {{ match.awayScore }} </td>
                            <td> {{ match.awayTeam }} </td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>
</div>
